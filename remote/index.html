<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Botonazo">
  <meta name="description" content="Botonazo: tu deck de botones para Chrome, en el celular.">
  <meta name="author" content="Miguel Mogrovejo">
  <meta name="referrer" content="no-referrer">
  <title>Botonazo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=1.1.0">
</head>
<body>
  <div class="app" id="app" data-conn="connecting">
    <header class="top">
      <button class="status" id="status-btn" type="button">
        <i class="dot"></i>
        <span id="status-text"></span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="open-gallery" type="button" data-t-aria="captures" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          <span class="count" id="gallery-count"></span>
        </button>
        <button class="icon-btn" id="open-settings" type="button" data-t-aria="settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>
    <div class="target" id="target"><span id="target-title"></span></div>

    <main class="deck" id="deck"></main>

    <nav class="pages" id="pages" role="tablist"></nav>

    <!-- Pantalla de conexión -->
    <div class="gate" id="gate">
      <div class="gate-inner">
        <img src="icon.svg" class="gate-logo" width="84" height="84" alt="">
        <h1 id="gate-title"></h1>
        <p id="gate-body"></p>
        <div class="spinner" id="gate-spinner"></div>
        <button class="btn" type="button" id="gate-retry" data-t="retry" hidden></button>
      </div>
      <p class="gate-credit">Botonazo · Miguel Mogrovejo</p>
    </div>

    <!-- Pestañas abiertas -->
    <dialog class="sheet tall" id="tabs-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 data-t="openTabs"></h2>
        <button class="icon-btn" type="button" id="tabs-refresh" data-t-aria="refresh">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
      </div>
      <ul class="tab-list" id="tab-list"></ul>
      <button type="button" class="btn" data-close data-t="close"></button>
    </dialog>

    <!-- Captura -->
    <dialog class="sheet tall" id="shot-sheet">
      <div class="sheet-handle"></div>
      <h2 data-t="capture"></h2>
      <div class="shot-frame"><img id="shot-img" alt=""></div>
      <p class="shot-hint" data-t="shotHint"></p>
      <button type="button" class="btn primary" id="shot-save" data-t="saveShot"></button>
      <button type="button" class="btn" data-close data-t="close"></button>
    </dialog>

    <!-- Capturas de la sesión -->
    <dialog class="sheet tall" id="gallery-sheet">
      <div class="sheet-handle"></div>
      <h2 data-t="captures"></h2>
      <div class="gallery" id="gallery"></div>
      <button type="button" class="btn" data-close data-t="close"></button>
    </dialog>

    <!-- Pantalla en vivo -->
    <div class="viewer" id="viewer" hidden>
      <div class="viewer-top">
        <span class="live-pill" id="live-pill"><i></i><span id="live-text"></span></span>
        <span class="viewer-title" id="viewer-title"></span>
        <button class="icon-btn" type="button" id="viewer-close" data-t-aria="close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="viewer-stage">
        <video id="viewer-video" playsinline muted autoplay></video>
        <img id="viewer-img" alt="">
        <div class="viewer-wait" id="viewer-wait"><div class="spinner"></div><span id="viewer-wait-text"></span></div>
      </div>
    </div>

    <!-- Ajustes -->
    <dialog class="sheet" id="settings">
      <form method="dialog">
        <div class="sheet-handle"></div>
        <h2 data-t="settings"></h2>
        <label class="field field-row">
          <span data-t="haptics"></span>
          <input type="checkbox" class="switch" id="haptics">
        </label>
        <label class="field field-row">
          <span data-t="keepAwake"></span>
          <input type="checkbox" class="switch" id="wake">
        </label>
        <label class="field field-row">
          <span data-t="showLabels"></span>
          <input type="checkbox" class="switch" id="labels">
        </label>
        <div class="field field-row muted">
          <span data-t="latency"></span>
          <span id="latency">—</span>
        </div>
        <button type="button" class="btn danger" id="forget" data-t="forget"></button>
        <button type="submit" class="btn primary" value="close" data-t="done"></button>
        <p class="credit">Botonazo <span id="version"></span> · <span data-t="madeBy"></span> · <a href="privacy.html" target="_blank" rel="noopener" data-t="privacy"></a></p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="peerjs.min.js"></script>
  <script src="app.js?v=1.1.0"></script>
</body>
</html>
