<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<style>
  /* Chrome sin interfaz dibuja como mínimo 500 px de ancho y luego se recorta a 440: se posiciona desde la izquierda. */
  .keys { position: absolute; left: 262px; top: 62px; width: 156px; transform: rotate(-8deg); display: grid; grid-template-columns: repeat(3, 46px); gap: 9px; }
  .keys i { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 50%), var(--c, #2c2c31); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 16px -8px rgba(0,0,0,.8); }
  .keys i.hot { background: linear-gradient(#ffc24d, #ff7a00); box-shadow: 0 0 28px 4px rgba(255,159,10,.55); }
</style></head>
<body class="dark" style="background:radial-gradient(260px 200px at 340px 70%, rgba(255,159,10,.26), transparent 70%), #0b0b0c"><div class="stage">
  <div style="position:absolute;left:30px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:250px">
    <img src="../../extension/icons/icon-128.png" style="width:80px;height:80px;margin:-10px 0 2px -10px">
    <div style="font-size:38px;font-weight:750;letter-spacing:-.045em">Botonazo</div>
    <div style="margin-top:6px;font-size:16px;line-height:1.4;color:#a1a1a6">Tu deck de botones<br>en el celular</div>
  </div>
  <div class="keys">
    <i style="--c:#0A84FF"></i><i style="--c:#FF3B30"></i><i style="--c:#5E5CE6"></i>
    <i></i><i class="hot"></i><i style="--c:#30D158"></i>
    <i style="--c:#BF5AF2"></i><i></i><i style="--c:#FF375F"></i>
  </div>
</div></body></html>
