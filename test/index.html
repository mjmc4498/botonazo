<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página de prueba — Botonazo</title>
  <style>
    body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #111; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 2400px; }
    input, textarea { display: block; width: 100%; margin: 8px 0 16px; padding: 10px; font: inherit; }
    iframe { width: 100%; height: 120px; border: 1px solid #ccc; background: #fff; }
    #log { font: 12px monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Página de prueba</h1>
    <p>Recibe atajos, texto, desplazamiento y control de audio desde Botonazo.</p>
    <input id="field" placeholder="Campo de texto">
    <audio id="audio" controls loop></audio>
    <iframe id="frame" title="iframe de otro origen"></iframe>
    <pre id="log"></pre>
  </main>
  <script>
    // Audio de prueba: 60 s de un tono suave en WAV (se puede pausar, adelantar y cambiar el volumen).
    (() => {
      const rate = 8000, seconds = 60, n = rate * seconds;
      const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / rate * 2 * Math.PI * 220) * 1200, true);
      document.getElementById('audio').src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    })();
    // El iframe se carga desde otro origen (127.0.0.1 ↔ localhost) para probar el enrutamiento.
    const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
    document.getElementById('frame').src = `${location.protocol}//${other}:${location.port}/test/frame.html`;
    window.keys = [];
    addEventListener('keydown', (e) => {
      window.keys.push({ key: e.key, code: e.code, keyCode: e.keyCode, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey });
      document.getElementById('log').textContent = JSON.stringify(window.keys.slice(-5));
    }, true);
  </script>
</body>
</html>
